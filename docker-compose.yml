services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospeda_leads
      POSTGRES_USER: hospeda
      POSTGRES_PASSWORD: hospeda
    volumes:
      - hospeda-leads-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospeda -d hospeda_leads"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://hospeda:hospeda@postgres:5432/hospeda_leads
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      BREVO_API_KEY: ${BREVO_API_KEY}
    ports:
      - "3001:3001"

volumes:
  hospeda-leads-db:
