<html lang="es">

    <meta name="theme-color" content="#3AA7D9" />
    <title>Hospeda CRM</title>
    <!-- The hospeda.com.ar logo with «CRM» under it (white background on the apple-touch icon, which iOS would fill with black). -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Declare layer order before any chunked stylesheet loads: Mantine CSS may arrive before src/styleLayers.css. -->
    <style>@layer base, mantine;</style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
