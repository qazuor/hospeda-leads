<!-- Synthetic model of the floating chat Instagram opens over a profile after «Enviar mensaje» (spec 97 §9.1 item 3): no link to
     /direct/t/<id>/, but buttons «Volver», «Expandir» and «Cerrar». «Expandir» navigates to the chat page. Its composer is never used. -->
<div role="dialog" aria-label="qaz.uor" id="floating-chat">
  <div><div role="button" tabindex="0" aria-label="Volver"></div><span dir="auto">qaz.uor</span><div role="button" tabindex="0" aria-label="Expandir" id="expand"></div><div role="button" tabindex="0" aria-label="Cerrar"></div></div>
  <div role="grid"></div>
  <div contenteditable="true" role="textbox" tabindex="0" data-lexical-editor="true" id="floating-composer"><p><br></p></div>
</div>
