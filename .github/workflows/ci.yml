name: CI

on:
  push:
    branches: [main, migration/floot-port]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospeda_leads
          POSTGRES_USER: hospeda
          POSTGRES_PASSWORD: hospeda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospeda -d hospeda_leads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hospeda:hospeda@127.0.0.1:5432/hospeda_leads
      JWT_SECRET: ci-test-secret-that-is-long-enough-for-hs256
      ADMIN_EMAIL: admin@example.com
      PUBLIC_APP_URL: http://127.0.0.1:3001
      BREVO_API_KEY: ci-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed:test
      - name: Commercial migration and integration tests
        run: npm run test:commercial
        env:
          CRM_TEST_DATABASE: "1"
      - name: Tasks and activities migration and integration tests
        run: npm run test:work
        env:
          CRM_TEST_DATABASE: "1"
      - name: Pipeline migration and integration tests
        run: npm run test:pipeline
        env:
          CRM_TEST_DATABASE: "1"
      - run: npm run build
      - name: Start server
        run: |
          npm start > /tmp/hospeda-leads.log 2>&1 &
          echo $! > /tmp/hospeda-leads.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/_api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hospeda-leads.log
          exit 1
      - name: Smoke test API
        run: |
          curl -fsS http://127.0.0.1:3001/_api/health | grep '"ok":true'
          curl -fsS -o /tmp/session.json -w '%{http_code}' http://127.0.0.1:3001/_api/auth/session | grep '401'

      - name: Install Chromium for commercial browser test
        run: npx playwright install --with-deps chromium

      - name: Commercial browser test
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-evidence
          path: test-results/

      - name: Stop source server
        run: |
          kill "$(cat /tmp/hospeda-leads.pid)" || true

      - name: Build production Docker image
        run: docker build -t hospeda-leads:ci .

      - name: Smoke test production Docker image
        run: |
          docker run -d             --name hospeda-leads-ci             --network host             -e NODE_ENV=production             -e PORT=3001             -e DATABASE_URL="$DATABASE_URL"             -e JWT_SECRET="$JWT_SECRET"             -e ADMIN_EMAIL="$ADMIN_EMAIL"             -e BREVO_API_KEY="$BREVO_API_KEY"             -e PUBLIC_APP_URL="$PUBLIC_APP_URL"             hospeda-leads:ci

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/_api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3001/_api/health | grep '"ok":true'
          docker exec hospeda-leads-ci npm run db:migrate
          docker rm -f hospeda-leads-ci

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/hospeda-leads.log || true
